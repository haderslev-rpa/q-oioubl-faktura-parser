[project]
name = "q-oioubl-faktura-parser"
version = "0.1.0"
description = "læse oioubl xml filer - fakturaer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client",
    "xmltodict",
    "smbclient",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_oioubl_faktura_parser"] #Husk det "ikke" skal være bindestreg
